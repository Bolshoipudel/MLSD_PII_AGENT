[project]
name = "self-improving-pii-detection"
version = "0.1.0"
description = "Локальный агент, который находит причины ошибок детектора ПД и исправляет их через политику детектора"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
eda = [
    "pandas>=2.2,<4",
    "pyarrow>=18,<27",
    "matplotlib>=3.8,<4",
    "numpy>=1.26,<3",
    "nbformat>=5.10,<6",
    "nbclient>=0.10,<0.11",
    "ipykernel>=6.29,<8",
]

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pre-commit==4.7.0",
    "pytest>=8,<10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
